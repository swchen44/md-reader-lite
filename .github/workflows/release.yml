name: Release

on:
  push:
    tags: ['v*']
  # 手動觸發 = 乾跑：只建置驗證，不發佈
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: |
          node --test tests/unit/*.test.mjs
          node_modules/.bin/tsc --noEmit

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./package.json').version")-dryrun" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package
        env:
          npm_package_version: ${{ steps.ver.outputs.version }}
          npm_package_name: md-reader-lite
        run: |
          node ./scripts/manifest.mjs
          node_modules/.bin/webpack --config ./build/webpack.prod.js
          node ./scripts/zip.mjs
          ls -la dist/

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/md-reader-lite-${GITHUB_REF_NAME#v}.zip" \
            --title "MD Reader Lite ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "Manual install: unzip, then chrome://extensions → Developer mode → Load unpacked. Privacy: https://github.com/swchen44/md-reader-lite/blob/main/PRIVACY.md"

      - name: Upload dry-run artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: md-reader-lite-dryrun
          path: dist/*.zip
          retention-days: 7
